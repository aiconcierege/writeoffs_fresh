name: Staging backup certification

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Read-only inspection or existing backup certification
        required: true
        default: backup
        type: choice
        options: [backup, inspect-retention]
      backup_class:
        description: Backup retention class
        required: true
        default: daily
        type: choice
        options: [daily, weekly, monthly]

permissions:
  contents: read

concurrency:
  group: writeoffs-staging-backup
  cancel-in-progress: false

jobs:
  backup:
    if: ${{ inputs.operation != 'inspect-retention' }}
    environment: staging-backup
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify pinned PostgreSQL 17 Docker client
        run: node scripts/backup/pg-dump-docker.mjs --version
      - name: Create and certify encrypted staging backup
        run: npm run backup:staging-s3
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ACCOUNT_DELETION_HMAC_KEY: ${{ secrets.ACCOUNT_DELETION_HMAC_KEY }}
          WRITEOFFS_BACKUP_DATABASE_URL: ${{ secrets.WRITEOFFS_BACKUP_DATABASE_URL }}
          WRITEOFFS_BACKUP_PG_DUMP_RUNNER: scripts/backup/pg-dump-docker.mjs
          WRITEOFFS_BACKUP_EXPECTED_PG_DUMP_MAJOR: "17"
          WRITEOFFS_BACKUP_KEY_BASE64: ${{ secrets.WRITEOFFS_BACKUP_KEY_BASE64 }}
          WRITEOFFS_BACKUP_SOURCE_ENVIRONMENT: staging
          WRITEOFFS_BACKUP_EXPECTED_SUPABASE_PROJECT_REF: ${{ vars.WRITEOFFS_BACKUP_EXPECTED_SUPABASE_PROJECT_REF }}
          WRITEOFFS_BACKUP_CLASS: ${{ inputs.backup_class || 'daily' }}
          WRITEOFFS_BACKUP_S3_REGION: us-east-2
          WRITEOFFS_BACKUP_S3_BUCKET: writeoffs-backups-264524064115-us-east-2-an
          WRITEOFFS_BACKUP_EXPECTED_S3_BUCKET: writeoffs-backups-264524064115-us-east-2-an
          WRITEOFFS_BACKUP_S3_PREFIX: ${{ vars.WRITEOFFS_BACKUP_S3_PREFIX }}
          WRITEOFFS_BACKUP_S3_ACCESS_KEY_ID: ${{ secrets.WRITEOFFS_BACKUP_S3_ACCESS_KEY_ID }}
          WRITEOFFS_BACKUP_S3_SECRET_ACCESS_KEY: ${{ secrets.WRITEOFFS_BACKUP_S3_SECRET_ACCESS_KEY }}

  inspect-retention:
    if: ${{ inputs.operation == 'inspect-retention' }}
    environment: staging-backup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Inspect existing staging backup controls without mutations
        run: node scripts/backup/inspect-s3-retention.mjs > retention-inspection.json
        env:
          WRITEOFFS_BACKUP_S3_REGION: us-east-2
          WRITEOFFS_BACKUP_S3_BUCKET: writeoffs-backups-264524064115-us-east-2-an
          WRITEOFFS_BACKUP_EXPECTED_S3_BUCKET: writeoffs-backups-264524064115-us-east-2-an
          WRITEOFFS_BACKUP_S3_PREFIX: ${{ vars.WRITEOFFS_BACKUP_S3_PREFIX }}
          WRITEOFFS_BACKUP_S3_ACCESS_KEY_ID: ${{ secrets.WRITEOFFS_BACKUP_S3_ACCESS_KEY_ID }}
          WRITEOFFS_BACKUP_S3_SECRET_ACCESS_KEY: ${{ secrets.WRITEOFFS_BACKUP_S3_SECRET_ACCESS_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: staging-backup-retention-inspection
          path: retention-inspection.json
          retention-days: 14
