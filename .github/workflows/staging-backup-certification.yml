name: Staging backup certification

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Read-only inspection or existing backup certification
        required: true
        default: backup
        type: choice
        options: [backup, inspect-retention, certify-ledger, diagnose-ledger, certify-ledger-boundaries, copy-recovery, certify-hosted-dr]
      backup_class:
        description: Backup retention class
        required: true
        default: daily
        type: choice
        options: [daily, weekly, monthly]

permissions:
  contents: read

concurrency:
  group: writeoffs-staging-backup
  cancel-in-progress: false

jobs:
  backup:
    if: ${{ inputs.operation == 'backup' }}
    environment: staging-backup
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify pinned PostgreSQL 17 Docker client
        run: node scripts/backup/pg-dump-docker.mjs --version
      - name: Create and certify encrypted staging backup
        run: npm run backup:staging-s3
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ACCOUNT_DELETION_HMAC_KEY: ${{ secrets.ACCOUNT_DELETION_HMAC_KEY }}
          WRITEOFFS_BACKUP_DATABASE_URL: ${{ secrets.WRITEOFFS_BACKUP_DATABASE_URL }}
          WRITEOFFS_BACKUP_PG_DUMP_RUNNER: scripts/backup/pg-dump-docker.mjs
          WRITEOFFS_BACKUP_EXPECTED_PG_DUMP_MAJOR: "17"
          WRITEOFFS_BACKUP_KEY_BASE64: ${{ secrets.WRITEOFFS_BACKUP_KEY_BASE64 }}
          WRITEOFFS_BACKUP_SOURCE_ENVIRONMENT: staging
          WRITEOFFS_BACKUP_EXPECTED_SUPABASE_PROJECT_REF: ${{ vars.WRITEOFFS_BACKUP_EXPECTED_SUPABASE_PROJECT_REF }}
          WRITEOFFS_BACKUP_CLASS: ${{ inputs.backup_class || 'daily' }}
          WRITEOFFS_BACKUP_S3_REGION: us-east-2
          WRITEOFFS_BACKUP_S3_BUCKET: writeoffs-backups-264524064115-us-east-2-an
          WRITEOFFS_BACKUP_EXPECTED_S3_BUCKET: writeoffs-backups-264524064115-us-east-2-an
          WRITEOFFS_BACKUP_S3_PREFIX: ${{ vars.WRITEOFFS_BACKUP_S3_PREFIX }}
          WRITEOFFS_BACKUP_S3_ACCESS_KEY_ID: ${{ secrets.WRITEOFFS_BACKUP_S3_ACCESS_KEY_ID }}
          WRITEOFFS_BACKUP_S3_SECRET_ACCESS_KEY: ${{ secrets.WRITEOFFS_BACKUP_S3_SECRET_ACCESS_KEY }}

  inspect-retention:
    if: ${{ inputs.operation == 'inspect-retention' }}
    environment: staging-backup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Inspect existing staging backup controls without mutations
        run: node scripts/backup/inspect-s3-retention.mjs > retention-inspection.json
        env:
          WRITEOFFS_BACKUP_S3_REGION: us-east-2
          WRITEOFFS_BACKUP_S3_BUCKET: writeoffs-backups-264524064115-us-east-2-an
          WRITEOFFS_BACKUP_EXPECTED_S3_BUCKET: writeoffs-backups-264524064115-us-east-2-an
          WRITEOFFS_BACKUP_S3_PREFIX: ${{ vars.WRITEOFFS_BACKUP_S3_PREFIX }}
          WRITEOFFS_BACKUP_S3_ACCESS_KEY_ID: ${{ secrets.WRITEOFFS_BACKUP_S3_ACCESS_KEY_ID }}
          WRITEOFFS_BACKUP_S3_SECRET_ACCESS_KEY: ${{ secrets.WRITEOFFS_BACKUP_S3_SECRET_ACCESS_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: staging-backup-retention-inspection
          path: retention-inspection.json
          retention-days: 14

  certify-ledger:
    if: (inputs.operation == 'certify-ledger' || inputs.operation == 'diagnose-ledger' || inputs.operation == 'certify-ledger-boundaries') && github.ref == 'refs/heads/v2-onboarding-staging'
    environment: staging-backup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify independent ledger with synthetic data only
        run: node scripts/backup/certify-live-deletion-ledger.mjs > ledger-certification.json
        env:
          WRITEOFFS_LEDGER_READ_ONLY_DIAGNOSTICS: ${{ inputs.operation == 'diagnose-ledger' }}
          WRITEOFFS_LEDGER_BOUNDARY_CERTIFICATION: ${{ inputs.operation == 'certify-ledger-boundaries' }}
          WRITEOFFS_DELETION_LEDGER_ACCESS_KEY_ID: ${{ secrets.WRITEOFFS_DELETION_LEDGER_ACCESS_KEY_ID }}
          WRITEOFFS_DELETION_LEDGER_SECRET_ACCESS_KEY: ${{ secrets.WRITEOFFS_DELETION_LEDGER_SECRET_ACCESS_KEY }}
          WRITEOFFS_DELETION_LEDGER_RECOVERY_ACCESS_KEY_ID: ${{ secrets.WRITEOFFS_DELETION_LEDGER_RECOVERY_ACCESS_KEY_ID }}
          WRITEOFFS_DELETION_LEDGER_RECOVERY_SECRET_ACCESS_KEY: ${{ secrets.WRITEOFFS_DELETION_LEDGER_RECOVERY_SECRET_ACCESS_KEY }}
          WRITEOFFS_DELETION_LEDGER_KEY_BASE64: ${{ secrets.WRITEOFFS_DELETION_LEDGER_KEY_BASE64 }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: staging-ledger-certification
          path: ledger-certification.json
          retention-days: 14
          if-no-files-found: error

  copy-recovery:
    permissions:
      contents: read
      actions: read
    if: inputs.operation == 'copy-recovery' && github.ref == 'refs/heads/v2-onboarding-staging'
    environment: staging-backup
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/backup/copy-protected-recovery-secrets.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WRITEOFFS_RECOVERY_BOOTSTRAP_TOKEN: ${{ secrets.WRITEOFFS_RECOVERY_BOOTSTRAP_TOKEN }}
          WRITEOFFS_DELETION_LEDGER_KEY_BASE64: ${{ secrets.WRITEOFFS_DELETION_LEDGER_KEY_BASE64 }}
          WRITEOFFS_DELETION_LEDGER_RECOVERY_ACCESS_KEY_ID: ${{ secrets.WRITEOFFS_DELETION_LEDGER_RECOVERY_ACCESS_KEY_ID }}
          WRITEOFFS_DELETION_LEDGER_RECOVERY_SECRET_ACCESS_KEY: ${{ secrets.WRITEOFFS_DELETION_LEDGER_RECOVERY_SECRET_ACCESS_KEY }}
  verify-recovery:
    needs: copy-recovery
    environment: staging-dr-recovery
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/backup/verify-protected-recovery-copy.mjs > recovery-copy-verification.json
        env:
          WRITEOFFS_DELETION_LEDGER_KEY_BASE64: ${{ secrets.WRITEOFFS_DELETION_LEDGER_KEY_BASE64 }}
          WRITEOFFS_DELETION_LEDGER_RECOVERY_ACCESS_KEY_ID: ${{ secrets.WRITEOFFS_DELETION_LEDGER_RECOVERY_ACCESS_KEY_ID }}
          WRITEOFFS_DELETION_LEDGER_RECOVERY_SECRET_ACCESS_KEY: ${{ secrets.WRITEOFFS_DELETION_LEDGER_RECOVERY_SECRET_ACCESS_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: protected-recovery-copy-verification
          path: recovery-copy-verification.json
          retention-days: 14

  certify-hosted-dr:
    if: inputs.operation == 'certify-hosted-dr' && github.ref == 'refs/heads/v2-onboarding-staging'
    environment: staging-backup
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify portable PostgreSQL 17 clients
        run: |
          node scripts/backup/pg17-client.mjs psql --version
          node scripts/backup/pg17-client.mjs pg_restore --version
      - name: Synthetic hosted resurrection and fail-closed restore certification
        run: node scripts/backup/drill-hosted-fresh-restore.mjs > hosted-dr-certification.json
        env:
          WRITEOFFS_HOSTED_DR_CONFIRM: synthetic-only
          WRITEOFFS_TEMP_DR_TARGET_JSON: ${{ secrets.WRITEOFFS_TEMP_DR_TARGET_JSON }}
          WRITEOFFS_BACKUP_DATABASE_URL: ${{ secrets.WRITEOFFS_BACKUP_DATABASE_URL }}
          WRITEOFFS_DELETION_LEDGER_ACCESS_KEY_ID: ${{ secrets.WRITEOFFS_DELETION_LEDGER_ACCESS_KEY_ID }}
          WRITEOFFS_DELETION_LEDGER_SECRET_ACCESS_KEY: ${{ secrets.WRITEOFFS_DELETION_LEDGER_SECRET_ACCESS_KEY }}
          WRITEOFFS_DELETION_LEDGER_RECOVERY_ACCESS_KEY_ID: ${{ secrets.WRITEOFFS_DELETION_LEDGER_RECOVERY_ACCESS_KEY_ID }}
          WRITEOFFS_DELETION_LEDGER_RECOVERY_SECRET_ACCESS_KEY: ${{ secrets.WRITEOFFS_DELETION_LEDGER_RECOVERY_SECRET_ACCESS_KEY }}
          WRITEOFFS_DELETION_LEDGER_KEY_BASE64: ${{ secrets.WRITEOFFS_DELETION_LEDGER_KEY_BASE64 }}
      - name: Preserve preparation failure evidence
        if: always()
        env:
          DR_JOB_STATUS: ${{ job.status }}
        run: |
          if [ ! -s hosted-dr-certification.json ]; then
            node -e 'const fs=require("fs");fs.writeFileSync("hosted-dr-certification.json",JSON.stringify({kind:"HOSTED_DR_TEST",result:"FAIL",stage:"workflow-preparation",drillStarted:false,jobStatus:process.env.DR_JOB_STATUS,runId:process.env.GITHUB_RUN_ID,activationEligible:false,productionCutover:false},null,2))'
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hosted-dr-certification
          path: hosted-dr-certification.json
          retention-days: 30
          if-no-files-found: error
